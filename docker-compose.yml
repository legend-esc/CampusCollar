version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: campuscollar
      POSTGRES_PASSWORD: campuscollar_dev
      POSTGRES_DB: campuscollar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campuscollar']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  stellar-rpc:
    image: stellar/quickstart:soroban-dev
    ports:
      - '8000:8000'
    environment:
      ENABLE_SOROBAN_RPC: true
      NETWORK: local
    volumes:
      - stellardata:/opt/stellar

volumes:
  pgdata:
  stellardata:
