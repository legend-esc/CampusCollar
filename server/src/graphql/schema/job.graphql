enum JobStatus {
  POSTED
  FUNDED
  ACCEPTED
  IN_PROGRESS
  COMPLETED
  PAID
  DISPUTED
  RESOLVED
  CANCELLED
  EXPIRED
}

type Job {
  id: ID!
  title: String!
  description: String!
  category: String
  amount: Float!
  status: JobStatus!
  location: String
  deadline: String
  customer: User!
  worker: User
  payment: Payment
  messages: [Message!]!
  dispute: Dispute
  createdAt: String!
  updatedAt: String!
}

type Message {
  id: ID!
  content: String!
  sender: User!
  createdAt: String!
}

type Dispute {
  id: ID!
  reason: String
  status: String!
  winnerId: String
  resolvedAt: String
  createdAt: String!
}

input JobFilter {
  status: JobStatus
  category: String
  customerId: ID
  workerId: ID
}

extend type Query {
  jobs(filters: JobFilter): [Job!]!
  job(id: ID!): Job
}

extend type Mutation {
  createJob(title: String!, description: String!, category: String, amount: Float!, deadline: String): Job!
  fundJob(id: ID!): Job!
  acceptJob(id: ID!): Job!
  completeJob(id: ID!): Job!
  disputeJob(id: ID!, reason: String!): Job!
  cancelJob(id: ID!): Job!
}

type Subscription {
  jobStatusChanged(id: ID!): Job!
  newMessage(jobId: ID!): Message!
}
